# qr.tommie.jp — QR search Ver2 (docker: 127.0.0.1:3000)
#
# このファイルがリポジトリ側の正。vps2 へは ../../doDeployNginx.sh で反映する
# (実体は vps2:/etc/nginx/sites-available/qr.tommie.jp、sites-enabled から symlink)。
# サーバ上で直接編集しないこと。
#
# ローカル再現用の ../../Caddyfile と対になる設定。ボディ上限を変えたら両方に入れること。
#
# 認証はここではやらない (docs/18-ログイン計画.md)。ログインしなくてもヘッダの帯を
# 出すため、Basic 認証はアプリへ移した (src/proxy.ts と src/lib/auth/basicAuth.ts)。
# auth_basic をここに戻すと、どのページを開いてもいきなり認証ダイアログが出る
# 昔の挙動に戻る。公開してよいパス (PWA の manifest / アイコン、使い方の docs) の
# 一覧も src/lib/auth/publicPaths.ts が正本 — かつてここに並べていた
# `auth_basic off` の location 群の移設先。
#
# /etc/nginx/.htpasswd-qr はもう読まれない。パスワードの正本は
# vps2:~/41-QR-search/qr-search/.env の BASIC_AUTH_USER / BASIC_AUTH_HASH_B64。
# 生成: npm run hash-password (docs/18-ログイン計画.md)
#
# ssl_* と http→https リダイレクトは certbot --nginx が生成したもの。

# ログイン試行のレート制限用。認証がアプリへ移ったことで、総当たりが Node と
# bcrypt まで届くようになった (vps2 は非力で、コスト 12 で約 1.75 秒。まさに
# 殴られると痛い場所)。エッジで先に絞る。10m ≒ 16 万アドレス分の状態を持てる。
#
# 30r/m は「人がログインし直す分には絶対に当たらないが、総当たりには効く」線。
# 1 回のログインで /login は 2 往復する (未認証の 401 → 資格情報つきの再送)
# ため、10r/m だと 5 回で頭打ちになり、実際にログインを試していて 503 を
# 踏んだ。bcrypt 自体が 1.75 秒の重しなので、ここは緩めても総当たりは伸びない
limit_req_zone $binary_remote_addr zone=qr_login:10m rate=30r/m;

# 資格情報つきの試行だけを数える別枠 (2026-11 のセキュリティ監査 M-17)。
# 上の 30r/m は「401 → 資格情報つきの再送」の 2 往復を通すための値で、総当たりには
# 緩い。bcrypt を回すのは Authorization ヘッダが付いた要求だけなので、それだけを
# 6r/m で数える。ヘッダが無い要求はキーを空にして計上しない (nginx の仕様)。
# アプリ側にも同時 1 本 + 待ち 3 本の門がある (src/lib/auth/loginGate.ts)
map $http_authorization $qr_login_cred_key {
    default $binary_remote_addr;
    ""      "";
}
limit_req_zone $qr_login_cred_key zone=qr_login_cred:10m rate=6r/m;

# 画像配信 (監査 M-10)。/api/images/<name> の GET は未ログインでも proxy を素通りし、
# route が公開ノートかを DB で判定する。乱打で DB を削られないよう、一覧のサムネ
# 数十枚が同時に出ても当たらない緩い枠で絞る (burst は先読みの分を見込む)
limit_req_zone $binary_remote_addr zone=qr_images:10m rate=30r/s;

# 回路図の描画 (監査 M-13)。1 件が TeX で最大 10 秒。ライブプレビューの打鍵でも
# 数秒に 1 回なので 30r/m で足りる。アプリ側にも待ち行列の上限がある
limit_req_zone $binary_remote_addr zone=qr_circuits:10m rate=30r/m;

# 速度計測のアクセスログ (docs/119-速度計測ログ計画.md §4)。
# アプリの計時は「返し始めるまで」、ブラウザは「届き切るまで」しか測れないので、
# 同じ要求で両方を並べる場所としてここに残す。rt (送り終わるまで) − urt (上流が
# 返し切るまで) が回線に食われた時間。rsc=1 は打鍵などの RSC 要求。
# $uri はクエリを含まない (検索語は載らない)。log_format は http の文脈にしか
# 書けないので server の外に置く。ローテートは Debian の logrotate に任せる
log_format qr_perf '$time_iso8601 $status $request_method $uri '
                   'rt=$request_time urt=$upstream_response_time '
                   'bytes=$body_bytes_sent rsc=$http_rsc ua="$http_user_agent"';

server {
    server_name qr.tommie.jp;

    # 速度計測 (docs/119 §4)。**既定の access.log も並べて書く** — server に
    # access_log を 1 行でも書くと、http から受け継ぐ既定のログは止まる
    access_log /var/log/nginx/access.log;
    access_log /var/log/nginx/qr-perf.log qr_perf;

    # 本文の上限の**既定は 1MB** (2026-11 の監査 M-15)。大きな本文が要るのは
    # 下の 4 系統 (添付・クリップボードの枠・シークレット・取り込み) だけで、
    # それ以外の口 (JSON は 512KB まで。src/lib/route/parse.ts) に 35MB を
    # 未ログインで投げ込めると、nginx がディスクへ溜め Next が 31MB をメモリに
    # 複製する。要る口にだけ location で開ける
    client_max_body_size 1m;

    # 枠を超えた要求は 503 ではなく 429 で断る (ブラウザと計測が区別できる)
    limit_req_status 429;

    # **セキュリティヘッダはここに書かない。** HSTS はホスト共通の nginx.conf が
    # 全サイトに付けており (add_header … always)、この server に add_header を
    # 1 行でも書くと継承が切れて HSTS が消える。他のヘッダ (nosniff・Referrer-Policy・
    # Permissions-Policy・X-Frame-Options・COOP) はアプリの next.config.ts が、
    # CSP は src/proxy.ts が付ける (src/lib/security/)

    # location へ継承させるため server レベルに置く
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ログインの口だけ絞る。burst=10 nodelay:
    # nodelay を付けるのは、付けないと超過分が「待たされる」形になり、
    # ただでさえ bcrypt で 1.75 秒待つログインが数十秒黙って固まって見えるため。
    # nodelay なら burst の範囲は即座に通し、超えた分だけ 503 で明確に断る
    location = /login {
        limit_req zone=qr_login burst=10 nodelay;
        # 資格情報つきの試行はさらに絞る (上の qr_login_cred)。複数の limit_req は
        # 同じ location に併記でき、すべてが適用される
        limit_req zone=qr_login_cred burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    # パスキーの口も同じ枠で絞る (docs/29-パスキー計画.md §9)。
    #
    # 狙いは総当たりではない — 署名は公開鍵で検証するので当てずっぽうでは
    # 通らない。防ぎたいのは「チャレンジ発行の乱打」で、これは 1 回ごとに
    # サーバのメモリ (auth/webauthnChallenge.ts の Map) を消費する。
    #
    # /login と枠を共有してよい。どちらも「人がログインする」動作で、
    # 30r/m は普通に使う分には当たらない
    location ^~ /api/auth/ {
        limit_req zone=qr_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    # 計測ログの取得口 (docs/120 §3)。ログインせず取得鍵で通す口なので、
    # 誰でも叩ける。鍵は 256 ビットで当てずっぽうは成り立たないが、1 回ごとに
    # DB を 1 回引くので、乱打でメモリの細い VPS を削られないよう絞る。
    # 手元のスクリプトが測るたびに 1 回読むだけなので、ログインの枠で足りる
    location = /api/logs/perf/export {
        limit_req zone=qr_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    # 添付のアップロード (POST /api/images)。動画 30MB + multipart の包み
    # (41-QR-search/docs/14-動画挿入計画.md)。アプリ側 (uploads/limits.ts
    # maxUploadBytes) と揃える — ここが小さいと録画がアプリに届く前に 413 になる
    location = /api/images {
        client_max_body_size 35M;
        proxy_pass http://127.0.0.1:3000;
    }

    # 添付の配信 (GET /api/images/<name>) と回転。未ログインでも届く口なので枠を掛ける
    location ^~ /api/images/ {
        limit_req zone=qr_images burst=200 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    # サーバ経由のクリップボードの枠 (docs/114)。動画も置けるので添付と同じ上限
    location ^~ /api/clipboard/ {
        client_max_body_size 35M;
        proxy_pass http://127.0.0.1:3000;
    }

    # シークレットの暗号文 (docs/51)。動画まで包めるので添付と同じ上限
    location ^~ /api/secrets/ {
        client_max_body_size 35M;
        proxy_pass http://127.0.0.1:3000;
    }

    # 回路図の描画 (POST /api/circuits)。TeX を起動する重い口なので枠を掛ける。
    # POST 専用の口なので、location / と違って RSC プリフェッチを巻き込まない
    location = /api/circuits {
        limit_req zone=qr_circuits burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    # ノートの取り込みだけ大きなボディを通す (docs/28-エクスポート計画.md §3)。
    #
    # **server 既定 (1m) を上げないのが要点**。500MB を全パスに開くと、
    # どの口へでも巨大なボディを投げ込めることになる。取り込みはログイン必須で、
    # アプリ側もバイト列を溜めずに流して展開する (lib/zip/readZip.ts) ので、
    # ここだけ開けてよい。アプリ側の上限 (lib/zip/limits.ts の MAX_ZIP_BYTES)
    # と揃える — ここが小さいと、アプリに届く前に 413 でボディを読み捨てられ、
    # ブラウザには "Load failed" としか出ない
    location = /api/import {
        client_max_body_size 512M;
        # 500MB の受信は分単位でかかる。既定 (60s) のままだと、途中で
        # nginx 側が諦めて 504 になる
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # ボディをディスクへ溜めてから渡すと、その間アプリは何も受け取れず
        # 「流して展開する」設計が効かない。そのまま流す
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/qr.tommie.jp/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/qr.tommie.jp/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = qr.tommie.jp) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name qr.tommie.jp;
    return 404; # managed by Certbot


}
